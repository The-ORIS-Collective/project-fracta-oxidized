[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", default-features = false, features = [
    "3d",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_text",
    "default_font",
    "wayland",
    "x11",
] }
bevy_rapier3d = { version = "0.37.0", features = [ "simd8", "parallel" ] }

serde = { version = "1", features = ["derive"] }
ron = "0.12"
